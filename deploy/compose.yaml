name: ${COMPOSE_PROJECT_NAME:-highland}
# Our images (app, migrate, ops, edge-check, updater) are never pulled by default (pull_policy never): the default names
# highland/app and highland/ops belong to someone else on Docker Hub. A private registry sets IMAGE_PULL_POLICY=missing.
x-db-url: &dburl postgres://app:${DB_PASSWORD:?run ops init}@db:5432/app
# Everything ops needs. Shared by `ops` and `updater`, so an update can back up, alert and
# address the right project with exactly the settings the daemon uses.
x-ops-env: &opsenv
  COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-highland}
  INSTANCE_MODE: ${INSTANCE_MODE:-production}
  DATABASE_URL: *dburl
  APP_INTERNAL_URL: http://app:3000
  CLIENT_LABEL: ${CLIENT_LABEL:?}
  HEALTH_TOKEN: ${HEALTH_TOKEN}
  BACKUP_REPOSITORY: ${BACKUP_REPOSITORY:?}
  BACKUP_PASSWORD: ${BACKUP_PASSWORD:?}
  BACKUP_ALLOW_LOCAL: ${BACKUP_ALLOW_LOCAL:-false}
  BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 2 * * *}
  RESTORE_TEST_SCHEDULE: ${RESTORE_TEST_SCHEDULE:-30 4 * * 0}
  BACKUP_KEEP: ${BACKUP_KEEP:---keep-daily 7 --keep-weekly 5 --keep-monthly 12}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-730}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
  B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
  RESTIC_REST_USERNAME: ${RESTIC_REST_USERNAME:-}
  RESTIC_REST_PASSWORD: ${RESTIC_REST_PASSWORD:-}
  MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
  MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:-}
  MATRIX_ROOM_ID: ${MATRIX_ROOM_ID:-}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  HEARTBEAT_URL: ${HEARTBEAT_URL:-}
  TUNNEL_ENABLED: ${TUNNEL_ENABLED:-false}
  # Ops warns (and Task 19 alerts) when these two do not match; the edge-check service below keeps the front door from
  # starting. Same defaults as the proxy and tunnel below.
  TUNNEL_IP: ${TUNNEL_IP:-172.30.250.10}
  EDGE_SUBNET: ${EDGE_SUBNET:-172.30.250.0/28}
services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment: { POSTGRES_DB: app, POSTGRES_USER: app, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    # Postgres needs a writable socket folder and /tmp; everything else in the image is read-only.
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "app", "-d", "app"], interval: 5s, retries: 20 }
  migrate:
    image: ${APP_IMAGE:-highland/app}:${APP_TAG:?}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    command: ["node", "apps/server/dist/db/migrate-cli.js"]
    environment: { DATABASE_URL: *dburl }
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  app:
    image: ${APP_IMAGE:-highland/app}:${APP_TAG}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    restart: unless-stopped
    # No `ports:` here, on purpose. Only Caddy can reach the app, over the internal network, and Caddy overwrites
    # X-Forwarded-For with the real client address. Publishing this port would let anyone send their own.
    environment:
      INSTANCE_MODE: ${INSTANCE_MODE:-production}
      APP_NAME: ${APP_NAME:?}
      APP_ORIGIN: ${APP_ORIGIN:?}
      DATABASE_URL: *dburl
      UPLOAD_DIR: /data/uploads
      EMAIL_TRANSPORT: smtp
      SMTP_URL: ${SMTP_URL:?}
      EMAIL_FROM: ${EMAIL_FROM:?}
      HEALTH_TOKEN: ${HEALTH_TOKEN:?}
      APP_VERSION: ${APP_TAG}
      WEB_DIST_DIR: /app/apps/web/dist
      TRUST_PROXY_HOPS: "1"   # exactly one proxy (Caddy) in front of the app
    volumes: [uploads:/data/uploads]
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  ops:
    image: ${OPS_IMAGE:-highland/ops}:${APP_TAG}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    command: ["daemon"]
    restart: unless-stopped
    environment: *opsenv
    volumes: [uploads:/data/uploads, state:/state]
    depends_on: { db: { condition: service_healthy } }
    # tunnelmon: only so the monitor can ask the tunnel whether it is connected (http://tunnel:2000/ready).
    networks: [backend, tunnelmon]
    # Locked down like the app, and as the app's own user (uid 1000, the owner of the uploads), so it needs no extra powers
    # at all to back up and put back the uploads. It never has the Docker socket. All it writes is the state volume (work
    # folder, restic cache), the uploads volume and /tmp. The root updater hands /state back to uid 1000 after each update.
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  # One-shot check before the front door starts: TUNNEL_IP must be a usable address inside EDGE_SUBNET, or Caddy would trust
  # the wrong address. A mismatch stops only the front door; backups and the rest of ops keep running.
  edge-check:
    image: ${OPS_IMAGE:-highland/ops}:${APP_TAG}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    command: ["check-edge"]
    environment: { TUNNEL_IP: "${TUNNEL_IP:-172.30.250.10}", EDGE_SUBNET: "${EDGE_SUBNET:-172.30.250.0/28}" }
    restart: "no"
    user: "1000:1000"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    # Caddy trusts a client-address header only from the tunnel container's fixed address (TUNNEL_IP), see the Caddyfile.
    # Not the whole network: Docker's gateway address (where traffic from the host side arrives) is on it too.
    environment: { SITE_ADDRESS: "${SITE_ADDRESS:-:80}", TUNNEL_IP: "${TUNNEL_IP:-172.30.250.10}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: { app: { condition: service_healthy }, edge-check: { condition: service_completed_successfully } }
    networks: [frontend, edge]
    # Caddy needs to open ports 80 and 443 and keep its certificates in /data; nothing else.
    read_only: true
    tmpfs: [/config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
  # Runs only on demand (docker compose run --rm updater update --to <version>). The only service with the Docker socket
  # (Ruling 7), which is root-equivalent anyway; it stays root because it rewrites APP_TAG in the operator's root-owned .env.
  updater:
    profiles: [tools]
    image: ${OPS_IMAGE:-highland/ops}:${UPDATER_TAG:-${APP_TAG}}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    working_dir: ${HF_BUNDLE_DIR:?}
    environment:
      <<: *opsenv
      HF_BUNDLE_DIR: ${HF_BUNDLE_DIR}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "${HF_BUNDLE_DIR}:${HF_BUNDLE_DIR}", "uploads:/data/uploads", "state:/state"]
    networks: [backend]
  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment: { TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}" }   # empty → cloudflared exits; the monitor reports it (Task 19)
    extra_hosts: ["host.docker.internal:host-gateway"]
    # The tunnel shares a network with the front door only: it cannot reach the app or the database directly. Its second
    # network, tunnelmon, is internal (no way out) and holds only ops, which has no open ports: the monitor reads the
    # tunnel's readiness there (port 2000).
    networks:
      edge:
        ipv4_address: ${TUNNEL_IP:-172.30.250.10}
      tunnelmon: {}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
# backend: database, migrations, app, ops. frontend: front door and app. edge: front door and tunnel only.
# tunnelmon: ops and the tunnel only, internal, so the monitor can check the tunnel.
networks:
  backend: {}
  frontend: {}
  tunnelmon: { internal: true }
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.250.0/28}
volumes: { pgdata: {}, uploads: {}, state: {}, caddy_data: {} }
